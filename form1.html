<!DOCTYPE html>
<html>
<head>
    <title>Application Form</title>
</head>
<body>

    <h2>Application Form</h2>

    <form>

        <label>Full Name:</label><br>
        <input type="text" name="fullname"><br><br>

        <label>Father Name:</label><br>
        <input type="text" name="fathername"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob"><br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="30"></textarea><br><br>

        <label>City:</label><br>
        <input type="text" name="city"><br><br>

        <label>State:</label><br>
        <input type="text" name="state"><br><br>

        <label>Contact Number:</label><br>
        <input type="tel" name="contact"><br><br>

        <label>Email ID:</label><br>
        <input type="email" name="email"><br><br>

        <label>Qualification:</label><br>
        <select name="qualification">
            <option>10th</option>
            <option>Intermediate</option>
            <option>Diploma</option>
            <option>B.Tech</option>
        </select><br><br>

        <label>Skills:</label><br>
        <input type="checkbox" name="skill1"> C
        <input type="checkbox" name="skill2"> Python
        <input type="checkbox" name="skill3"> Java
        <br><br>


        <input type="submit" value="Submit Application">

    </form>

</body>
</html>
