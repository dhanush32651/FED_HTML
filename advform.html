<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f2f4f8;
        }

        .container{
            width:80%;
            max-width:900px;
            margin:30px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#1a237e;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:#555;
            margin-bottom:30px;
        }

        fieldset{
            border:1px solid #ccc;
            padding:20px;
            margin-bottom:20px;
            border-radius:8px;
        }

        legend{
            font-weight:bold;
            color:#1a237e;
            padding:0 10px;
        }

        .row{
            display:flex;
            gap:20px;
            margin-bottom:15px;
            flex-wrap:wrap;
        }

        .col{
            flex:1;
            min-width:250px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
        }

        input, select, textarea{
            width:100%;
            padding:10px;
            border:1px solid #bbb;
            border-radius:5px;
            font-size:14px;
        }

        textarea{
            resize:vertical;
        }

        .inline{
            display:flex;
            align-items:center;
            gap:10px;
            margin-top:5px;
        }

        .inline input{
            width:auto;
        }

        .buttons{
            text-align:center;
            margin-top:25px;
        }

        button{
            padding:12px 30px;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
            margin:5px;
        }

        .register{
            background:#1a237e;
            color:white;
        }

        .reset{
            background:#757575;
            color:white;
        }

        button:hover{
            opacity:0.9;
        }

        footer{
            text-align:center;
            margin-top:20px;
            color:#777;
            font-size:13px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Student Application Form</h1>

    <p class="subtitle">Academic Year 2026 - 2027</p>

    <form>

        <!-- Personal Details -->

        <fieldset>

            <legend>Personal Details</legend>

            <div class="row">

                <div class="col">

                    <label>First Name</label>

                    <input type="text" placeholder="Enter first name" required>

                </div>

                <div class="col">

                    <label>Last Name</label>

                    <input type="text" placeholder="Enter last name" required>

                </div>

            </div>

            <div class="row">

                <div class="col">

                    <label>Date of Birth</label>

                    <input type="date">

                </div>

                <div class="col">

                    <label>Gender</label>

                    <div class="inline"><input type="radio" name="gender"> Male</div>
                    <div class="inline"><input type="radio" name="gender"> Female</div>
                    <div class="inline"><input type="radio" name="gender"> Other</div>

                </div>

            </div>

            <label>Upload Photograph</label>

            <input type="file">

        </fieldset>

        <!-- Contact Details -->

        <fieldset>

            <legend>Contact Details</legend>

            <div class="row">

                <div class="col">

                    <label>Email Address</label>

                    <input type="email" placeholder="student@example.com">

                </div>

                <div class="col">

                    <label>Mobile Number</label>

                    <input type="tel" placeholder="9876543210">

                </div>

            </div>

            <label>Address</label>

            <textarea rows="4"></textarea>

            <div class="row">

                <div class="col">

                    <label>City</label>

                    <input type="text">

                </div>

                <div class="col">

                    <label>State</label>

                    <input type="text">

                </div>

                <div class="col">

                    <label>Pincode</label>

                    <input type="number">

                </div>

            </div>

        </fieldset>

        <!-- Academic Details -->

        <fieldset>

            <legend>Academic Details</legend>

            <div class="row">

                <div class="col">

                    <label>Course</label>

                    <select>

                        <option>Select Course</option>
                        <option>B.Tech CSE</option>
                        <option>B.Tech AIML</option>
                        <option>B.Tech ECE</option>
                        <option>B.Tech EEE</option>
                        <option>B.Tech Mechanical</option>

                    </select>

                </div>

                <div class="col">

                    <label>Year of Admission</label>

                    <select>

                        <option>2026</option>
                        <option>2025</option>
                        <option>2024</option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col">

                    <label>10th Percentage</label>

                    <input type="number" step="0.01">

                </div>

                <div class="col">

                    <label>12th Percentage</label>

                    <input type="number" step="0.01">

                </div>

            </div>

        </fieldset>

        <!-- Account Details -->

        <fieldset>

            <legend>Account Details</legend>

            <div class="row">

                <div class="col">

                    <label>Password</label>

                    <input type="password">

                </div>

                <div class="col">

                    <label>Confirm Password</label>

                    <input type="password">

                </div>

            </div>

        </fieldset>

        <!-- Skills -->

        <fieldset>

            <legend>Skills & Interests</legend>

            <label>Programming Skills</label>

            <div class="inline"><input type="checkbox"> C</div>
            <div class="inline"><input type="checkbox"> Java</div>
            <div class="inline"><input type="checkbox"> Python</div>
            <div class="inline"><input type="checkbox"> HTML/CSS</div>
            <div class="inline"><input type="checkbox"> JavaScript</div>

            <br>

            <label>Area of Interest</label>

            <select>

                <option>Web Development</option>
                <option>Artificial Intelligence</option>
                <option>Data Science</option>
                <option>Cyber Security</option>
                <option>Cloud Computing</option>

            </select>

        </fieldset>

        <!-- Additional Information -->

        <fieldset>

            <legend>Additional Information</legend>

            <label>Favorite Color</label>

            <input type="color">

            <br><br>

            <label>English Communication Level</label>

            <input type="range" min="0" max="100">

            <br><br>

            <label>Application Completion</label>

            <progress value="80" max="100"></progress>

            <br><br>

            <label>About Yourself</label>

            <textarea rows="5" placeholder="Write about yourself"></textarea>

        </fieldset>

        <!-- Declaration -->

        <fieldset>

            <legend>Declaration</legend>

            <div class="inline">

                <input type="checkbox" required>

                <label>I hereby declare that all the information provided is true and correct.</label>

            </div>

        </fieldset>

        <!-- Buttons -->

        <div class="buttons">

            <button type="submit" class="register">Register Now</button>

            <button type="reset" class="reset">Reset Form</button>

        </div>

    </form>

    <footer>
        &copy; 2026 Student Admission Portal | Front-End Project
    </footer>

</div>

</body>
</html>
